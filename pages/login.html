<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Foodiez | Fast Food Delivery</title>
  <meta name="description" content="Sign in to your Foodiez account to access saved addresses, coupons, and fast re-ordering.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .auth-container-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--shadow-lg);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-input-group {
      margin-bottom: 16px;
    }

    .auth-input-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .auth-input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.92rem;
      outline: none;
      background: var(--surface-subtle);
      transition: all var(--transition-fast);
    }

    .auth-input-group input:focus {
      background: var(--surface);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 82, 0, 0.12);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <div class="header-left">
        <a href="../index.html" class="brand-logo">
          <div class="logo-icon">🍔</div>
          <span>Food<span>iez</span></span>
        </a>
      </div>
      <div>
        <a href="signup.html" class="btn btn-secondary btn-sm">Create New Account</a>
      </div>
    </div>
  </header>

  <!-- Login Form Main -->
  <div class="auth-container-wrapper">
    <div class="auth-box">
      
      <div class="auth-header">
        <div style="font-size: 2.5rem; margin-bottom: 6px;">👋</div>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 4px;">Welcome Back!</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to order your favorite meals</p>
      </div>

      <form onsubmit="Auth.handleLogin(event)">
        
        <div class="auth-input-group">
          <label for="login-identifier">Email Address or Phone Number</label>
          <input type="text" id="login-identifier" value="thanushmasika@gmail.com" placeholder="e.g. thanushmasika@gmail.com" required>
        </div>

        <div class="auth-input-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label for="login-password" style="margin-bottom: 0;">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--primary); font-weight: 600;" onclick="FoodApp.showToast('Password reset link sent to registered email!', 'info'); return false;">Forgot?</a>
          </div>
          <input type="password" id="login-password" value="Thanush@123" placeholder="••••••••" required>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px; font-size: 0.88rem; color: var(--text-muted); font-weight: 600;">
          <input type="checkbox" id="remember-me" checked style="accent-color: var(--primary);">
          <label for="remember-me">Keep me logged in</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-bottom: 20px;">
          Sign In &rarr;
        </button>

        <div style="text-align: center; font-size: 0.9rem; color: var(--text-muted);">
          Don't have an account? <a href="signup.html" style="color: var(--primary); font-weight: 700;">Sign up free</a>
        </div>

      </form>

    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 Foodiez Technologies Inc. All rights reserved.</div>
        <div>🔒 256 Bit SSL Encrypted</div>
      </div>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
