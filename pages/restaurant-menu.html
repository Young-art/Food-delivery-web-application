<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu | Foodiez</title>
  <meta name="description" content="View restaurant menu, ratings, chef specials, and customize your meal for express delivery.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .restaurant-hero-header {
      background: var(--surface);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      overflow: hidden;
      margin: 24px 0 32px;
      box-shadow: var(--shadow-sm);
    }

    .rest-hero-banner-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .rest-hero-details {
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .rest-hero-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .rest-hero-cuisine {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .rest-pills-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .rest-stat-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      text-align: center;
      background: var(--surface-subtle);
    }

    .rest-stat-score {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Menu Layout */
    .menu-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 32px;
      margin-bottom: 60px;
    }

    .menu-sidebar-nav {
      position: sticky;
      top: 100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      height: fit-content;
    }

    .menu-nav-heading {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 8px 10px 12px;
      letter-spacing: 0.5px;
    }

    .menu-nav-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      transition: all var(--transition-fast);
      margin-bottom: 4px;
    }

    .menu-nav-link:hover, .menu-nav-link.active {
      background: var(--primary-light);
      color: var(--primary);
    }

    .menu-section {
      margin-bottom: 40px;
      scroll-margin-top: 100px;
    }

    .menu-section-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @media (max-width: 860px) {
      .menu-layout {
        grid-template-columns: 1fr;
      }
      .menu-sidebar-nav {
        position: static;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <div class="header-left">
        <a href="../index.html" class="brand-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
          </div>
          <span>Food<span>iez</span></span>
        </a>
        <div class="location-selector">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="current-location-text">Bangalore, Indiranagar</span>
          <span class="loc-arrow">
            <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
      </div>

      <div class="header-search">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" class="global-search-input" placeholder="Search dishes & restaurants...">
      </div>

      <nav class="header-nav">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="restaurants.html" class="nav-link active">Restaurants</a>
        <a href="pizza.html" class="nav-link">Categories</a>
        <a href="favorites.html" class="nav-link">Favorites</a>
        <a href="order-history.html" class="nav-link">Orders</a>
      </nav>

      <div style="display: flex; align-items: center; gap: 14px;">
        <a href="cart.html" class="cart-nav-btn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span>Cart</span>
          <span class="cart-count">0</span>
        </a>

        <div class="user-nav-dropdown">
          <button class="user-avatar-btn">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" alt="Avatar" class="user-avatar-img">
            <span class="user-name-text">Thanush</span>
            <span style="font-size: 0.75rem; color: var(--text-muted); display:inline-flex; align-items:center;">
              <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
          </button>
          <div class="dropdown-menu">
            <a href="profile.html" class="dropdown-item">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> My Profile
            </a>
            <a href="order-history.html" class="dropdown-item">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg> Order History
            </a>
            <a href="favorites.html" class="dropdown-item">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Saved Items
            </a>
            <div class="dropdown-divider"></div>
            <a href="login.html" class="dropdown-item">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Login / Signup
            </a>
          </div>
        </div>

        <button class="mobile-menu-btn">☰</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <!-- Breadcrumbs -->
    <div class="breadcrumb-nav">
      <a href="../index.html">Home</a>
      <span class="breadcrumb-separator">/</span>
      <a href="restaurants.html">Restaurants</a>
      <span class="breadcrumb-separator">/</span>
      <span id="breadcrumb-rest-name" style="color: var(--text-main); font-weight: 700;">Menu</span>
    </div>

    <!-- Restaurant Hero Card -->
    <div class="restaurant-hero-header" id="rest-hero-card">
      <!-- Populated via JavaScript -->
    </div>

    <!-- Menu Filter & Search Toolbar -->
    <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;">
      
      <div style="position: relative; flex: 1; min-width: 220px;">
        <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); display:flex; align-items:center;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="menu-search-input" placeholder="Search in this menu..." 
          style="width: 100%; padding: 8px 14px 8px 36px; border-radius: var(--radius-full); border: 1px solid var(--border); background: var(--surface-subtle); font-size: 0.88rem; outline: none;">
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="chip" id="veg-toggle-btn" onclick="RestaurantMenuPage.toggleVegFilter()" style="display:inline-flex; align-items:center; gap:6px;">
          <span class="badge-diet veg" style="width:10px; height:10px;"></span> Veg Only
        </button>
      </div>

    </div>

    <!-- Menu Two-Column Layout -->
    <div class="menu-layout">
      
      <!-- Sidebar Categories Navigation -->
      <aside class="menu-sidebar-nav">
        <div class="menu-nav-heading" style="display:flex; align-items:center; justify-content:space-between;">
          <span>Menu Sections</span>
          <span class="badge badge-primary" style="font-size:0.7rem; padding:2px 6px;">CATEGORIES</span>
        </div>
        <div id="menu-categories-nav">
          <!-- Injected via JavaScript -->
        </div>
      </aside>

      <!-- Menu Items Sections -->
      <div id="menu-sections-container">
        <!-- Injected via JavaScript -->
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 Foodiez Technologies Inc. All rights reserved.</div>
        <div style="display: flex; gap: 20px; align-items: center;">
          <span style="display:inline-flex; align-items:center; gap:4px;"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 256 Bit SSL Encrypted</span>
          <span style="display:inline-flex; align-items:center; gap:4px;"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> 30 Min Delivery Promise</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/search.js"></script>
  <script>
    const RestaurantMenuPage = {
      restaurant: null,
      vegOnly: false,
      searchQuery: "",

      init: function() {
        const urlParams = new URLSearchParams(window.location.search);
        const restId = urlParams.get("id") || "rest-1";
        
        const allRests = FoodAppStorage.getRestaurants();
        this.restaurant = allRests.find(r => r.id === restId) || allRests[0];

        this.renderHero();
        this.renderMenu();
        this.bindEvents();
      },

      bindEvents: function() {
        const searchInput = document.getElementById("menu-search-input");
        if (searchInput) {
          searchInput.addEventListener("input", (e) => {
            this.searchQuery = e.target.value.trim().toLowerCase();
            this.renderMenu();
          });
        }
      },

      toggleVegFilter: function() {
        this.vegOnly = !this.vegOnly;
        const btn = document.getElementById("veg-toggle-btn");
        if (btn) btn.classList.toggle("active", this.vegOnly);
        this.renderMenu();
      },

      renderHero: function() {
        const r = this.restaurant;
        const bcName = document.getElementById("breadcrumb-rest-name");
        if (bcName) bcName.textContent = r.name;

        const heroEl = document.getElementById("rest-hero-card");
        const favs = FoodAppStorage.getFavorites();

        heroEl.innerHTML = `
          <img src="${r.banner}" alt="${r.name}" class="rest-hero-banner-img">
          <div class="rest-hero-details">
            <div>
              <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 4px;">
                <h1 class="rest-hero-title">${r.name}</h1>
                <button class="food-fav-btn ${favs.restaurantIds.includes(r.id) ? 'active' : ''}" 
                  onclick="FoodApp.toggleFavoriteRestaurant('${r.id}', this)" aria-label="Favorite Restaurant">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                </button>
              </div>
              <div class="rest-hero-cuisine">${r.cuisine} • ${r.address}</div>
              <div class="rest-pills-row">
                <span class="rating-pill" style="font-size: 0.85rem; padding: 4px 10px;">
                  <svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                  ${r.rating} (${r.ratingCount}+ ratings)
                </span>
                <span class="badge badge-offer">
                  <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><circle cx="7" cy="7" r="1"/></svg>
                  ${r.offer}
                </span>
                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600; display:inline-flex; align-items:center; gap:4px;">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  ${r.openingHours}
                </span>
              </div>
            </div>
            
            <div style="display: flex; gap: 14px;">
              <div class="rest-stat-box">
                <div class="rest-stat-score" style="display:flex; align-items:center; gap:4px;">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  ${r.deliveryTime}
                </div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Delivery Time</div>
              </div>
              <div class="rest-stat-box">
                <div class="rest-stat-score" style="display:flex; align-items:center; gap:4px;">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
                  ${r.distance}
                </div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Distance</div>
              </div>
              <div class="rest-stat-box">
                <div class="rest-stat-score">₹${r.deliveryFee}</div>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Delivery Fee</div>
              </div>
            </div>
          </div>
        `;
      },

      renderMenu: function() {
        const r = this.restaurant;
        const allItems = FoodAppStorage.getFoodItems();
        
        // Filter items associated with this restaurant or its category tags
        let items = allItems.filter(item => 
          item.restaurantId === r.id || (r.categories && r.categories.includes(item.category))
        );

        if (this.vegOnly) {
          items = items.filter(item => item.veg);
        }

        if (this.searchQuery) {
          items = items.filter(item => 
            item.name.toLowerCase().includes(this.searchQuery) ||
            item.description.toLowerCase().includes(this.searchQuery)
          );
        }

        // Group by categories
        const categoriesMap = {};
        items.forEach(item => {
          if (!categoriesMap[item.category]) {
            categoriesMap[item.category] = [];
          }
          categoriesMap[item.category].push(item);
        });

        const navContainer = document.getElementById("menu-categories-nav");
        const sectionsContainer = document.getElementById("menu-sections-container");

        if (items.length === 0) {
          sectionsContainer.innerHTML = `
            <div style="padding: 50px 20px; text-align: center; background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border);">
              <div style="margin-bottom: 12px; color: var(--text-muted);">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </div>
              <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 4px;">No items found matching your filters</h3>
              <p style="color: var(--text-muted); font-size: 0.9rem;">Try turning off 'Veg Only' or searching a different term.</p>
            </div>
          `;
          navContainer.innerHTML = "";
          return;
        }

        let navHtml = "";
        let sectionsHtml = "";
        const favs = FoodAppStorage.getFavorites();

        Object.keys(categoriesMap).forEach(catKey => {
          const catItems = categoriesMap[catKey];
          const catInfo = FoodData.categories.find(c => c.id === catKey) || { 
            name: catKey.toUpperCase(), 
            icon: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path></svg>` 
          };
          
          navHtml += `
            <a href="#section-${catKey}" class="menu-nav-link" style="display:flex; align-items:center; justify-content:space-between;">
              <span style="display:inline-flex; align-items:center; gap:8px;">
                <span class="cat-icon-badge" style="width:24px; height:24px;">${catInfo.icon}</span>
                <strong>${catInfo.name}</strong>
              </span>
              <span class="badge badge-primary" style="font-size: 0.72rem; padding: 2px 7px;">${catItems.length}</span>
            </a>
          `;

          sectionsHtml += `
            <div class="menu-section" id="section-${catKey}">
              <div class="menu-section-title" style="display:flex; align-items:center; gap:10px;">
                <span class="cat-icon-badge" style="width:32px; height:32px;">${catInfo.icon}</span>
                <span>${catInfo.name}</span>
                <span class="badge badge-primary" style="font-size:0.75rem; padding:3px 10px;">${catItems.length} DISHES</span>
              </div>
              <div class="food-grid">
                ${catItems.map(food => {
                  const originalPrice = Math.round(food.price * (1 + (food.discount / 100)));
                  return `
                    <div class="food-card" id="food-card-${food.id}">
                      <div class="food-card-img-wrapper" onclick="window.location.href='food-details.html?id=${food.id}'" style="cursor: pointer;">
                        <img src="${food.image}" alt="${food.name}" class="food-card-img">
                        ${food.discount > 0 ? `<div class="food-discount-badge">${food.discount}% OFF</div>` : ''}
                        <button class="food-fav-btn ${favs.foodIds.includes(food.id) ? 'active' : ''}" 
                          onclick="event.stopPropagation(); FoodApp.toggleFavoriteFood('${food.id}', this)" aria-label="Favorite dish">
                          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </button>
                      </div>
                      <div class="food-card-content">
                        <div class="food-card-header">
                          <div style="display:flex; align-items:center; gap:8px;">
                            <span class="badge-diet ${food.veg ? 'veg' : 'non-veg'}"></span>
                            <h4 class="food-card-title" onclick="window.location.href='food-details.html?id=${food.id}'" style="cursor:pointer;">${food.name}</h4>
                          </div>
                          <span class="rating-pill" style="font-size:0.75rem;">
                            <svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                            ${food.rating}
                          </span>
                        </div>
                        <div style="margin: 4px 0 8px;">
                          <span class="badge badge-primary" style="font-size:0.68rem; padding:2px 8px; text-transform:uppercase;">${food.category}</span>
                        </div>
                        <p class="food-card-desc">${food.description}</p>
                        <div class="food-card-footer">
                          <div class="food-price-box">
                            <span class="food-current-price">₹${food.price}</span>
                            ${food.discount > 0 ? `<span class="food-original-price">₹${originalPrice}</span>` : ''}
                          </div>
                          <button class="food-add-btn" onclick="FoodApp.openCustomizerModal('${food.id}')">
                            Add +
                          </button>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        });

        navContainer.innerHTML = navHtml;
        sectionsContainer.innerHTML = sectionsHtml;
      }
    };

    document.addEventListener("DOMContentLoaded", () => RestaurantMenuPage.init());
  </script>
</body>
</html>
